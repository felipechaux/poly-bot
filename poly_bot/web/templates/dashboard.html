<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Invest Bot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e6e8ee; --muted:#8b92a3;
          --up:#2fbf71; --down:#e5484d; --accent:#5b8def; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding:16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap;
           gap:8px; align-items:center; justify-content:space-between; }
  h1 { font-size:18px; margin:0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  main { padding:16px; max-width:1200px; margin:0 auto; display:grid; gap:16px; }
  .badge { background:#24304a; color:#a9c2ff; padding:2px 8px; border-radius:99px; font-size:12px; }
  .muted { color:var(--muted); font-size:12px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; min-width:0; }
  .kpi .v { font-size:20px; font-weight:600; margin-top:4px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:500; cursor:pointer; }
  .bar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); }
  .alloc-row { display:grid; grid-template-columns:90px 1fr 50px; gap:8px; align-items:center; margin:6px 0; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  select, button, input { background:#11141a; color:var(--text); border:1px solid var(--line);
                          border-radius:8px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  pre { white-space:pre-wrap; margin:0; font:13px/1.5 ui-monospace, Menlo, monospace; }
  .pill { padding:1px 6px; border-radius:6px; font-size:12px; }
  .pill.alcista { background:#173826; color:var(--up); }
  .pill.bajista { background:#3a1a1c; color:var(--down); }
  .pill.mixta { background:#33301a; color:#e2c35b; }
  .chart-box { position:relative; height:260px; }
  .pill.binance { background:#3a3215; color:#f0b90b; }
  .pill.sim { background:#24304a; color:#a9c2ff; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Invest Bot <span class="badge" id="mode">paper</span></h1>
    <div class="muted" id="next">—</div>
  </div>
  <div class="muted">Simulado · no es asesoría financiera</div>
</header>
<main>
  <section class="grid" id="kpis"></section>

  <section class="card">
    <h2>Curva de capital (COP) vs benchmarks</h2>
    <div class="chart-box"><canvas id="equity"></canvas></div>
    <div class="muted" id="equity-note"></div>
  </section>

  <section class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
    <div class="card"><h2>Por clase</h2><div id="alloc-class"></div></div>
    <div class="card"><h2>Por región</h2><div id="alloc-region"></div></div>
    <div class="card"><h2>Por moneda</h2><div id="alloc-currency"></div></div>
  </section>

  <section class="card">
    <h2>Posiciones</h2>
    <div class="table-wrap"><table id="positions"></table></div>
  </section>

  <section class="card">
    <h2>Universo seguido</h2>
    <div class="controls">
      <select id="f-region"><option value="">Todas las regiones</option></select>
      <select id="f-trend"><option value="">Toda tendencia</option>
        <option>alcista</option><option>mixta</option><option>bajista</option></select>
      <input id="f-text" placeholder="Buscar (ej. NU)" size="14">
    </div>
    <div class="table-wrap"><table id="universe"></table></div>
  </section>

  <section class="card">
    <h2>Analistas IA — Claude vs Gemini</h2>
    <div class="table-wrap"><table id="llm-compare"></table></div>
    <div id="llm-summaries" style="margin-top:10px"></div>
    <div class="table-wrap" style="margin-top:10px"><table id="llm-journal"></table></div>
  </section>

  <section class="card">
    <h2>Órdenes a la apertura</h2>
    <p class="muted" id="orders-note"></p>
    <div class="table-wrap"><table id="orders"></table></div>
  </section>

  <section class="card">
    <h2>Binance Spot Testnet <span class="muted">· cripto con dinero falso</span></h2>
    <section class="grid" id="bn-kpis"></section>
    <div class="table-wrap" style="margin-top:10px"><table id="bn-orders"></table></div>
  </section>

  <section class="card">
    <h2>Último resumen</h2>
    <pre id="summary">—</pre>
    <div class="controls" style="margin-top:10px">
      <button id="btn-dry">Simular ciclo (dry run)</button>
    </div>
  </section>

  <section class="card">
    <h2>Movimientos</h2>
    <div class="table-wrap"><table id="txs"></table></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const pct = (x, s = true) => x == null ? "—" : (s && x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
const cls = (x) => x == null ? "" : x >= 0 ? "up" : "down";
const money = (v, c) => v == null ? "—" : c === "COP"
  ? "$ " + Math.round(v).toLocaleString("es-CO")
  : "US$ " + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (v, d = 2) => v == null ? "—" : v.toLocaleString("en-US", { maximumFractionDigits: d });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const get = async (u) => (await fetch(u)).json();

let universe = [], sortKey = "ret_3m", sortDir = -1, chart;

function kpis(p, s) {
  if (!p.ready) { $("kpis").innerHTML = '<div class="card">Esperando el primer ciclo…</div>'; return; }
  const b = Object.entries(p.benchmarks_since_start || {})
    .map(([t, r]) => `${t.replace(".CL", "")} <span class="${cls(r)}">${pct(r)}</span>`).join(" · ");
  const cards = [
    ["Total COP", money(p.total_cop, "COP")],
    ["Total USD", money(p.total_usd, "USD")],
    ["Desde inicio", `<span class="${cls(p.return_since_start)}">${pct(p.return_since_start)}</span>`, b],
    ["TRM", num(p.usdcop)],
    ["Caja", money(p.cash.COP || 0, "COP"), money(p.cash.USD || 0, "USD")],
    ["No realizado", `<span class="${cls(p.unrealized_cop)}">${money(p.unrealized_cop, "COP")}</span>`,
      "Comisiones " + money(p.fees_cop, "COP")],
  ];
  $("kpis").innerHTML = cards.map(([k, v, sub]) =>
    `<div class="card kpi"><div class="muted">${k}</div><div class="v">${v}</div>${sub ? `<div class="muted">${sub}</div>` : ""}</div>`).join("");
}

function alloc(id, obj) {
  const rows = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
  $(id).innerHTML = rows.map(([k, v]) =>
    `<div class="alloc-row"><span>${esc(k)}</span><div class="bar"><div style="width:${(v * 100).toFixed(1)}%"></div></div><span class="muted">${pct(v, false)}</span></div>`).join("") || '<span class="muted">—</span>';
}

function positions(rows) {
  const head = "<tr><th>Ticker</th><th>Cant.</th><th>Precio</th><th>Valor</th><th>Peso</th><th>P&amp;L</th></tr>";
  $("positions").innerHTML = head + rows.map((p) => `<tr>
    <td><b>${esc(p.ticker)}</b><div class="muted">${esc(p.name)}</div></td>
    <td>${num(p.quantity, 4)}</td><td>${num(p.price)}</td>
    <td>${money(p.market_value, p.currency)}</td><td>${pct(p.weight, false)}</td>
    <td class="${cls(p.unrealized)}">${pct(p.unrealized_pct)}</td></tr>`).join("");
}

function renderUniverse() {
  const r = $("f-region").value, t = $("f-trend").value, q = $("f-text").value.trim().toUpperCase();
  const rows = universe.filter((a) => (!r || a.region === r) && (!t || a.trend === t) &&
    (!q || a.ticker.includes(q) || (a.name || "").toUpperCase().includes(q)));
  rows.sort((a, b) => ((a[sortKey] ?? -1e9) > (b[sortKey] ?? -1e9) ? 1 : -1) * sortDir);
  const cols = [["ticker", "Activo"], ["price", "Precio"], ["ret_1d", "1d"], ["ret_1m", "1m"],
                ["ret_3m", "3m"], ["ret_1y", "1a"], ["vol_annual", "Vol"], ["trend", "Tendencia"]];
  $("universe").innerHTML = "<tr>" + cols.map(([k, l]) => `<th data-k="${k}">${l}${sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr>" +
    rows.map((a) => `<tr><td><b>${esc(a.ticker)}</b> <span class="muted">${esc(a.region)}</span><div class="muted">${esc(a.name)}</div></td>
      <td>${num(a.price)} <span class="muted">${a.currency}</span></td>
      ${["ret_1d", "ret_1m", "ret_3m", "ret_1y"].map((k) => `<td class="${cls(a[k])}">${pct(a[k])}</td>`).join("")}
      <td>${pct(a.vol_annual, false)}</td><td><span class="pill ${a.trend}">${a.trend}</span></td></tr>`).join("");
  $("universe").querySelectorAll("th").forEach((th) => th.onclick = () => {
    const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : -1; sortKey = k; renderUniverse();
  });
}

function venue(t) {
  const crypto = universe.some((a) => a.ticker === t.ticker && a.market === "CRYPTO");
  if (!crypto || (t.kind !== "BUY" && t.kind !== "SELL")) return "";
  const m = /\[Binance testnet #(\d+)\]/.exec(t.rationale || "");
  return m ? `<span class="pill binance">Binance #${m[1]}</span>` : '<span class="pill sim">Simulado</span>';
}

function txs(rows) {
  const head = "<tr><th>Fecha</th><th>Tipo</th><th>Ticker</th><th>Cant.</th><th>Precio</th><th>Monto</th><th>Comisión</th><th>Ejecución</th></tr>";
  $("txs").innerHTML = head + rows.map((t) => `<tr title="${esc(t.rationale)}">
    <td>${esc(t.occurred_at.slice(0, 10))}</td><td>${t.kind}</td>
    <td>${esc(t.ticker || (t.kind === "FX" ? t.from_currency + "→" + t.currency : ""))}</td>
    <td>${t.quantity ? num(t.quantity, 4) : ""}</td><td>${t.price ? num(t.price) : ""}</td>
    <td>${money(t.gross, t.currency)}</td><td>${t.fee ? money(t.fee, t.currency) : ""}</td>
    <td>${venue(t)}</td></tr>`).join("");
}

function binance(d) {
  const state = { on: '<span class="up">● conectado</span>', no_keys: '<span class="down">● sin llaves</span>',
                  off: '<span class="muted">● apagado</span>' }[d.state] || esc(d.state);
  const bal = d.balances ? Object.entries(d.balances).map(([k, v]) => `${esc(k)} ${num(v, k === "USDT" ? 2 : 6)}`).join("<br>") : "—";
  const st = d.stats_30d || {};
  const cards = [
    ["Estado", d.error ? `<span class="down">● error</span>` : state,
      d.error ? esc(d.error) : d.state === "no_keys" ? "Faltan BINANCE_TESTNET_API_KEY/SECRET en .env" :
      d.state === "off" ? "execution.binance_testnet.enabled: false" : "Órdenes cripto → testnet.binance.vision"],
    ["Saldos testnet", bal],
    ["Órdenes 30 días", `${st.ok || 0} <span class="muted">en Binance</span>`,
      `${st.fallback || 0} simuladas por fallo`],
    ["Desvío vs mercado", st.avg_abs_deviation == null ? "—" : pct(st.avg_abs_deviation, false),
      "promedio |Binance − Yahoo|"],
  ];
  $("bn-kpis").innerHTML = cards.map(([k, v, sub]) =>
    `<div class="card kpi"><div class="muted">${k}</div><div class="v" style="font-size:15px">${v}</div>${sub ? `<div class="muted">${sub}</div>` : ""}</div>`).join("");
  const rows = d.orders || [];
  $("bn-orders").innerHTML = rows.length ? "<tr><th>Fecha</th><th>Orden</th><th>Cant.</th><th>Binance</th><th>Mercado</th><th>Desvío</th><th>Comisión</th><th>Estado</th></tr>" +
    rows.map((o) => `<tr><td>${esc(new Date(o.occurred_at).toLocaleString("es-CO"))}</td>
      <td><b>${o.side === "BUY" ? "Compra" : "Venta"} ${esc(o.ticker)}</b> <span class="muted">${esc(o.strategy)}</span></td>
      <td>${num(o.quantity, 6)}</td><td>${o.price ? num(o.price) : "—"}</td><td>${num(o.market_price)}</td>
      <td class="${o.deviation == null ? "" : Math.abs(o.deviation) > 0.01 ? "down" : ""}">${o.deviation == null ? "—" : pct(o.deviation)}</td>
      <td>${o.fee ? "US$ " + num(o.fee, 4) : "—"}</td>
      <td>${o.status === "ok" ? `<span class="pill binance">#${o.order_id}</span>` : `<span class="pill sim" title="${esc(o.reason)}">simulado</span> <span class="muted">${esc((o.reason || "").slice(0, 60))}</span>`}</td></tr>`).join("")
    : '<tr><td class="muted">Sin órdenes cripto en el testnet todavía.</td></tr>';
}

function equity(snaps) {
  if (!snaps.length) { $("equity-note").textContent = "Sin snapshots todavía."; return; }
  const first = snaps[0], ccyOf = Object.fromEntries(universe.map((a) => [a.ticker, a.currency]));
  const series = [{ label: "Cartera", data: snaps.map((s) => s.value_base), borderColor: "#5b8def", tension: .2 }];
  const palette = ["#e2c35b", "#2fbf71", "#c07ef0"];
  Object.keys(first.benchmarks || {}).forEach((t, i) => {
    const p0 = first.benchmarks[t];
    series.push({ label: t.replace(".CL", ""), borderColor: palette[i % 3], borderDash: [4, 4], tension: .2,
      data: snaps.map((s) => {
        const p = s.benchmarks[t]; if (!p || !p0) return null;
        const fx = ccyOf[t] === "USD" ? s.usdcop / first.usdcop : 1;
        return first.value_base * (p / p0) * fx;
      }) });
  });
  series.forEach((d) => { d.pointRadius = snaps.length > 40 ? 0 : 2; d.borderWidth = 2; });
  const data = { labels: snaps.map((s) => s.day), datasets: series };
  if (chart) { chart.data = data; chart.update(); return; }
  chart = new Chart($("equity"), { type: "line", data, options: {
    responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
    plugins: { legend: { labels: { color: "#8b92a3" } },
               tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${money(c.parsed.y, "COP")}` } } },
    scales: { x: { ticks: { color: "#8b92a3", maxTicksLimit: 6 }, grid: { color: "#262a33" } },
              y: { ticks: { color: "#8b92a3", callback: (v) => "$" + (v / 1e6).toFixed(1) + "M" }, grid: { color: "#262a33" } } } } });
  $("equity-note").textContent = "Benchmarks = mismo capital inicial invertido 100% en cada uno (en COP).";
}

function llm(d) {
  const A = d.analysts || [];
  const k = (v) => v >= 1000 ? (v / 1000).toFixed(1) + "k" : String(Math.round(v || 0));
  const hr = (a, h) => { const x = a.hit_rates?.[h]; return x?.hit_rate == null ? "—" :
    `${pct(x.hit_rate, false)} <span class="muted">(n=${x.n}, ${pct(x.avg_ret)})</span>`; };
  const cls = (v) => v > 0 ? "up" : v < 0 ? "down" : "";
  const dot = { verde: "🟢", amarillo: "🟡", rojo: "🔴", gris: "⚪" };
  const rows = [
    ["Modelo", (a) => esc(a.model)],
    ["Semáforo", (a) => `${dot[a.semaforo.color] || "⚪"} ${esc(a.semaforo.label)}` +
      (a.semaforo.mean_excess == null ? "" : ` <span class="muted">(exceso ${pct(a.semaforo.mean_excess)} vs azar, ${a.semaforo.horizon_days}d)</span>`)],
    ["Estado", (a) => a.guard ? `<span class="down">⛔ en pausa: ${esc(a.guard)}</span>` : '<span class="up">activo</span>'],
    ["P&L cartera", (a) => `<span class="${cls(a.sleeve.pnl)}">${money(a.sleeve.pnl, d.base_currency)}</span>
      <span class="muted">${pct(a.sleeve.pnl_pct)}</span>`],
    ["Invertido / tope", (a) => `${money(a.sleeve.value, d.base_currency)} / ${money(a.sleeve.cap, d.base_currency)}`],
    ["Posiciones", (a) => esc(a.sleeve.positions.join(", ") || "—")],
    ["Acierto 1d", (a) => hr(a, "1d")], ["Acierto 7d", (a) => hr(a, "7d")], ["Acierto 30d", (a) => hr(a, "30d")],
    ["Tokens hoy", (a) => `${k(a.usage.tokens_today)} <span class="muted">(${a.usage.calls_today} llamada/s)</span>`],
    ["Tokens 30 días", (a) => `${k(a.usage.tokens_30d)} <span class="muted">(${a.usage.calls_30d} llamadas)</span>`],
    ["Duración prom.", (a) => a.usage.avg_duration_ms ? (a.usage.avg_duration_ms / 1000).toFixed(0) + " s" : "—"],
  ];
  $("llm-compare").innerHTML = `<tr><th></th>${A.map((a) => `<th>${esc(a.label)}</th>`).join("")}</tr>` +
    rows.map(([name, f]) => `<tr><td class="muted">${name}</td>${A.map((a) => `<td>${f(a)}</td>`).join("")}</tr>`).join("");
  $("llm-summaries").innerHTML = A.map((a) => `<pre class="muted"><b>${esc(a.label)}</b> ` + (a.latest ?
    esc(a.latest.occurred_at.slice(0, 16).replace("T", " ") + " UTC — " + (a.latest.resumen_mercado || "")) :
    "sin análisis todavía") + "</pre>").join("");
  const o = (x) => x ? `<span class="${x.hit ? "up" : "down"}">${pct(x.ret)}</span>` : '<span class="muted">…</span>';
  $("llm-journal").innerHTML = "<tr><th>Fecha</th><th>Analista</th><th>Idea</th><th>Conf.</th><th>Peso</th><th>1d</th><th>7d</th><th>30d</th></tr>" +
    (d.journal || []).map((r) => `<tr title="${esc(r.reasoning)}"><td>${esc(r.day)}</td><td>${esc(r.analyst)}</td>
      <td><b>${esc(r.decision)} ${esc(r.ticker)}</b>${r.planned ? "" : ' <span class="muted">(no ejecutada)</span>'}</td>
      <td>${r.confianza == null ? "—" : r.confianza.toFixed(2)}</td><td>${pct(r.peso, false)}</td>
      <td>${o(r.outcomes["1d"])}</td><td>${o(r.outcomes["7d"])}</td><td>${o(r.outcomes["30d"])}</td></tr>`).join("");
}

function orders(d) {
  $("orders-note").textContent = d.fill_mode === "next_open"
    ? `Se deciden a las 8:00 y se ejecutan al precio de apertura (BVC/EE. UU.); liquidación a las ${d.settle_time}. Cripto se ejecuta al momento.`
    : "Modo cierre: las órdenes se ejecutan al último cierre.";
  const st = { pending: "⏳ pendiente", filled: "✅ ejecutada", rejected: "⛔ rechazada", expired: "⌛ vencida", superseded: "↺ reemplazada" };
  const rows = [...(d.pending || []), ...(d.recent || []).slice().reverse()].slice(0, 40);
  $("orders").innerHTML = "<tr><th>Decidida</th><th>Estrategia</th><th>Orden</th><th>Monto</th><th>Estado</th><th>Nota</th></tr>" +
    rows.map((o) => `<tr><td>${esc(new Date(o.decided_at).toLocaleString("es-CO"))}</td><td>${esc(o.strategy)}</td>
      <td><b>${o.side === "BUY" ? "Compra" : "Venta"} ${esc(o.ticker)}</b></td>
      <td>${o.value ? o.value.toLocaleString("es-CO", { maximumFractionDigits: 0 }) : (o.quantity ?? "") + " u."}</td>
      <td>${st[o.status] || esc(o.status)}</td><td class="muted">${esc(o.note)}</td></tr>`).join("");
}

async function refresh() {
  try {
    const [s, p, pos, u, eq, t] = await Promise.all([get("/api/status"), get("/api/portfolio"),
      get("/api/positions"), get("/api/universe"), get("/api/equity"), get("/api/transactions?limit=100")]);
    $("mode").textContent = s.mode;
    const jobLabel = s.next_job === "settle" ? "Próxima ejecución de órdenes: "
      : (s.next_job || "").startsWith("scan:") ? "Próximo escaneo (" + s.next_job.slice(5) + "): " : "Próxima decisión: ";
    $("next").textContent = s.next_run_at ? jobLabel + new Date(s.next_run_at).toLocaleString("es-CO") : "";
    if (s.last_cycle) $("summary").textContent = s.last_cycle.title + "\n\n" + s.last_cycle.message;
    universe = u.assets;
    const regions = [...new Set(universe.map((a) => a.region))].sort();
    const sel = $("f-region"); if (sel.options.length === 1) regions.forEach((r) => sel.add(new Option(r, r)));
    kpis(p, s); alloc("alloc-class", p.allocation?.asset_class); alloc("alloc-region", p.allocation?.region);
    alloc("alloc-currency", p.allocation?.currency); positions(pos.positions); renderUniverse();
    equity(eq.snapshots); txs(t.transactions);
    get("/api/llm").then(llm).catch(() => {});
    get("/api/orders").then(orders).catch(() => {});
    get("/api/binance").then(binance).catch(() => {});
  } catch (e) { console.error(e); }
}

["f-region", "f-trend"].forEach((id) => $(id).onchange = renderUniverse);
$("f-text").oninput = renderUniverse;
$("btn-dry").onclick = async () => {
  $("summary").textContent = "Simulando…";
  const r = await fetch("/api/cycle?dry_run=true", { method: "POST" });
  const j = await r.json();
  $("summary").textContent = r.ok ? j.title + "\n\n" + j.message : "Error: " + (j.detail || r.status);
};
refresh();
setInterval(refresh, 60000);
</script>

# ============================================================
# Invest Bot — configuración por defecto (paper trading)
# Solo dinero ficticio. No es asesoría financiera.
# Variables de entorno (.env) sobreescriben modo, logging y ntfy.
# ============================================================

# --- Capital inicial ficticio ---
portfolio:
  base_currency: COP            # moneda de reporte principal
  initial_cash:
    COP: 10000000.0
    USD: 5000.0

# --- Ciclo diario ---
schedule:
  timezone: America/Bogota
  daily_run_time: "17:00"       # después del cierre BVC (~15:55) y NYSE (15:00 Bogotá)
  run_on_start: true            # al arrancar, corre el ciclo si hoy aún no se ha corrido
  weekdays_only: true

# --- Datos de mercado ---
market_data:
  fx_ticker: "COP=X"            # USD→COP (TRM aproximada de Yahoo)
  history_period: "2y"          # histórico para indicadores de tendencia
  cache_ttl_minutes: 30
  max_stale_days: 5             # precio más viejo que esto = no operable

# --- Costos simulados (por mercado) ---
costs:
  BVC:    {commission_pct: 0.003, min_commission: 10000.0, slippage_pct: 0.002, fractional: false}
  US:     {commission_pct: 0.001, min_commission: 1.0,     slippage_pct: 0.0005, fractional: true}
  CRYPTO: {commission_pct: 0.001, min_commission: 0.0,     slippage_pct: 0.001, fractional: true}
  fx_spread_pct: 0.005          # spread al convertir COP↔USD
  dividend_withholding:         # retención aproximada sobre dividendos
    US: 0.30                    # EE.UU. a no residentes (sin tratado)
    BVC: 0.0                    # simplificación; revisar con contador
    CRYPTO: 0.0

# --- Riesgo ---
risk:
  max_weight_per_asset: 0.50    # % del total
  max_weight_per_class:
    crypto: 0.10
    commodity: 0.20
    equity: 0.30                # acciones individuales (no ETFs)
  max_weight_per_region:
    CO: 0.40
  min_order_value_usd: 25.0     # no generar órdenes diminutas
  allow_short: false

# --- Estrategias ---
strategies:
  core_allocation:
    enabled: true
    params:
      rebalance: monthly        # primer ciclo hábil de cada mes
      drift_band: 0.05          # o si un activo se desvía > 5 pp del objetivo
      cash_buffer_pct: 0.01     # deja 1% en caja para comisiones
      targets:                  # pesos sobre el valor total (deben sumar 1.0)
        VT: 0.45                # global
        QQQ: 0.15               # global (tech US)
        ICOLCAP.CL: 0.10        # Colombia (ETF COLCAP, en COP)
        CIB: 0.05               # Colombia (Grupo Cibest ADR)
        ECOPETROL.CL: 0.05      # Colombia (en COP)
        BND: 0.10               # bonos
        GLD: 0.07               # oro
        BTC-USD: 0.03           # cripto


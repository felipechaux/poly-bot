# ============================================================
# Polymarket Bot — Default Configuration
# Override any value via environment variables or .env
# ============================================================

# --- Market Data Feed ---
feed:
  poll_interval_seconds: 10       # Was 5 — reduce polling, fewer low-quality signals
  market_refresh_seconds: 300
  max_markets: 25                 # Was 60 — fewer markets, higher quality selection
  # Only track markets with genuine uncertainty — skip long-shots and near-resolved
  min_yes_price: 0.10             # Was 0.05 — skip even more long-shots
  max_yes_price: 0.90             # Was 0.95 — skip near-resolved

# --- Risk Management ---
risk:
  max_position_size_usdc: 500.0   # Max single position in USDC
  max_total_exposure_usdc: 3000.0 # Max total portfolio exposure
  max_position_count: 10          # Max concurrent open positions
  min_market_liquidity_usdc: 1000.0  # Min market liquidity to consider
  min_price: 0.02                 # Reject orders below this price
  max_price: 0.98                 # Reject orders above this price
  order_debounce_seconds: 30      # Prevent duplicate signals within window

# --- Paper Trading ---
paper:
  initial_balance_usdc: 5000.0
  fill_mode: "order_book"         # "instant" | "order_book"
  simulated_latency_ms: 200       # Simulated fill latency

# --- Strategies ---
strategies:

  mean_reversion:
    enabled: true
    market_filters:
      min_liquidity_usdc: 5000.0
    params:
      # Entry: require genuine 24h overreaction signal (sharp price drop/spike)
      drop_threshold_pct: 15.0    # 15% 24h price change required to enter
      # Entry range: only buy in "meaningful uncertainty" zone, not extreme ends
      entry_low: 0.20             # Min YES price to enter (won't buy lottery tickets <20%)
      entry_high: 0.45            # Max YES price for YES buy (symmetric for NO buy: 0.55-0.80)
      # Exit: percentage gain from entry price (not absolute threshold)
      profit_target_pct: 0.15     # Exit when mid >= entry_price × 1.15 (+15%)
      position_size_usdc: 50.0    # Smaller positions while validating new logic
      stop_loss_pct: 0.20         # Tighter: exit if down 20% (was 35%)
      max_hold_days: 7            # Was 14

  ai_research:
    enabled: true
    params:
      min_edge_pct: 0.18          # 18% edge required (was 8% — far too low vs market noise)
      min_confidence: "high"      # Was "medium" — only high-conviction AI calls
      position_size_usdc: 75.0    # Was 100
      research_interval_min: 30.0 # Was 15 — less churn, more deliberate
      max_markets_per_cycle: 5    # Was 10 — research fewer, better markets
      min_research_liquidity: 5000.0  # Was 3000
      min_volume_usdc: 10000.0    # NEW: only research markets with real trading volume
      stop_loss_pct: 0.20         # Was 0.30 — tighter
      max_hold_days: 5            # Was 7

  momentum:
    enabled: false
    market_filters:
      min_liquidity_usdc: 5000.0
    params:
      # Minimum 1-hour price change % to enter
      min_change_pct: 5.0
      # Exit when momentum reverses by this %
      reversal_pct: 2.0
      position_size_usdc: 100.0
      # How many consecutive updates must confirm direction
      confirmation_periods: 3

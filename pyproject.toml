[project]
name = "poly-bot"
version = "0.1.0"
description = "Paper-trading investment bot (Colombia + global) with multi-currency portfolio"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.2",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "structlog>=24.2.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.0.0",
    # Market data
    "yfinance>=1.0.0",
    "pandas>=2.2.0",
    "tzdata>=2026.6",
]

[project.scripts]
poly-bot = "poly_bot.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly_bot"]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

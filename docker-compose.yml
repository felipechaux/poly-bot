services:
  invest-bot:
    build: .
    image: invest-bot:latest
    container_name: invest-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: America/Bogota
    ports:
      - "127.0.0.1:8080:8080"       # solo local; el iPhone entra por el túnel
    volumes:
      - ./data:/app/data            # SQLite (data/invest_bot.db)
      - ./config:/app/config:ro     # edit config/default.yaml without rebuilding
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Túnel rápido de Cloudflare (sin cuenta): expone el dashboard por HTTPS en una URL
  # aleatoria *.trycloudflare.com que cambia en cada reinicio. Ver: make tunnel-url
  tunnel:
    image: cloudflare/cloudflared:2026.3.0
    container_name: invest-bot-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://invest-bot:8080
    depends_on:
      - invest-bot
